<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quentin — Portfolio</title>
    <meta name="description" content="Modern engineering portfolio — projects, case studies, and contact." />

    <!-- Open Graph -->
    <meta property="og:title" content="Quentin — Portfolio" />
    <meta property="og:description" content="Projects, case studies, and contact." />
    <meta property="og:type" content="website" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Simple preconnect (optional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo.png" />


    <script>
      // Prevent theme flash
      (function () {
        try {
          const stored = localStorage.getItem("theme");
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = stored || (prefersDark ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
